<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCoding - Генератор Вибов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ VibeCoding ✨</h1>
            <p class="subtitle">Генератор настроений и вибов</p>
        </header>

        <div class="vibe-card">
            <div class="vibe-color" id="vibeColor"></div>

            <div class="vibe-content">
                <h2 id="vibeMood">Кликни, чтобы начать</h2>
                <p class="emoji" id="vibeEmoji">🎨</p>
                <p class="description" id="vibeDesc">Найди свой вайб</p>
                <p class="music" id="vibeMusic">🎵</p>
            </div>

            <button class="vibe-button" onclick="generateVibe()">ГЕНЕРИРОВАТЬ ВИБ</button>
            <button class="share-button" onclick="shareVibe()">📤 Поделиться</button>
        </div>

        <div class="stats">
            <p id="vibeCount">Вибов найдено: 0</p>
        </div>

        <footer>
            <p>Сделано с 💜 из телефона</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
